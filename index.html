<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Curve Editor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <header>
        <h1>Curve Editor</h1>
    </header>
    <main id="editor">
        <aside id="panel">
            <div class="range">
                <label>X min <input type="number" id="xmin" value="0" step="any"></label>
                <label>X max <input type="number" id="xmax" value="10" step="any"></label>
                <label>Y min <input type="number" id="ymin" value="0" step="any"></label>
                <label>Y max <input type="number" id="ymax" value="10" step="any"></label>
                <button id="applyRange" class="btn">Apply Range</button>
            </div>
            <button id="exportData" class="btn">Export .dat</button>
            <label for="importData" class="btn">Import .dat</label>
            <input type="file" id="importData" accept=".dat" class="hidden">
            <label for="bgImageInput" class="btn">Set Background</label>
            <input type="file" id="bgImageInput" accept="image/*" class="hidden">
            <button id="clearBg" class="btn">Clear Background</button>
            <button id="clearPlot" class="btn">Clear</button>
            <div class="rotate">
                <input type="number" id="rotateAngle" value="90" step="any">
                <button id="rotatePoints" class="btn">Rotate</button>
            </div>
            <button id="undo" class="btn">Undo</button>
            <button id="redo" class="btn">Redo</button>
            <button id="toggleLineBtn" class="btn">Hide Line</button>
            <div class="sample">
                <label>Sample count <input type="number" id="sampleCount" value="10" min="1"></label>
                <button id="sampleSegment" class="btn">Sample Segment</button>
            </div>
        </aside>
        <svg id="plot" width="800" height="500"></svg>
    </main>

    <script src="app.js"></script>
</body>
</html>
