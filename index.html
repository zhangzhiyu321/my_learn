<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Curve Editor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <header>
        <h1>Curve Editor</h1>
    </header>
    <main id="editor">
        <aside id="panel">
            <div class="range">
                <label>X min <input type="number" id="xmin" value="0" step="any"></label>
                <label>X max <input type="number" id="xmax" value="10" step="any"></label>
                <label>Y min <input type="number" id="ymin" value="0" step="any"></label>
                <label>Y max <input type="number" id="ymax" value="10" step="any"></label>
                <button id="applyRange">Apply Range</button>
            </div>
            <button id="exportData">Export .dat</button>
            <input type="file" id="importData" accept=".dat">
            <button id="clearPlot">Clear</button>
            <button id="copyPoints">Copy</button>
            <button id="pastePoints">Paste</button>
            <div class="rotate">
                <input type="number" id="rotateAngle" value="90" step="any">
                <button id="rotatePoints">Rotate</button>
            </div>
            <button id="undo">Undo</button>
            <button id="redo">Redo</button>
            <label class="toggle"><input type="checkbox" id="toggleLine" checked> Show Line</label>
            <div class="sample">
                <label>Sample count <input type="number" id="sampleCount" value="10" min="1"></label>
                <button id="sampleSegment">Sample Segment</button>
            </div>
        </aside>
        <svg id="plot" width="800" height="500"></svg>
    </main>

    <script src="app.js"></script>
</body>
</html>
